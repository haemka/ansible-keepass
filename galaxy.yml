namespace: haemka
name: keepass
version: 1.1.0
readme: README.md
authors:
- Hasni Mehdi <hasnimehdi@outlook.com>
- haemka <github@haemka.net>
description: |
  Ansible collection for reading and writing KeePass secrets.
  Fork of hasnimehdi91.keepass (https://github.com/Black-Cockpit/keepass) by Hasni Mehdi, extended with
  attachment support, fuller read/write field parity, and a test suite.
license_file: 'LICENSE'
tags:
- keepass
- keepass_ansible
- keepass_secrets
- keepass_automation
- ansible_secure_variable
- keepass_module
- secure_variables
dependencies: {}
repository: https://github.com/haemka/ansible-keepass
documentation: https://github.com/haemka/ansible-keepass/blob/master/README.md
homepage: https://github.com/haemka/ansible-keepass
issues: https://github.com/haemka/ansible-keepass/issues
build_ignore:
- "local_**.*"
- "*.ini"
- "*.kdbx"
- "*.txt"
- ".vscode"
- "venv"
- ".venv"
- ".git*"
- "*.cfg"
- "tests"
- "pyproject.toml"
- ".pytest_cache"
- ".coverage"
- ".coverage.*"

